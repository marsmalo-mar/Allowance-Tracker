<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Add Transaction</h1>

        <form method="POST">

            <label>Type</label>
            <select name="type" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

            <label>Amount</label>
            <input
                type="number"
                name="amount"
                step="0.01"
                min="0"
                required
            >

            <label>Category</label>
            <input
                type="text"
                name="category"
                placeholder="Food, Salary, Transport..."
                required
            >

            <label>Description</label>
            <input
                type="text"
                name="description"
                placeholder="Optional"
            >

            <label>Date</label>
            <input
                type="date"
                name="date"
                required
            >

            <label>Account</label>
            <input
                type="text"
                name="account"
                placeholder="Cash, GCash, BDO..."
                required
            >

            <button type="submit">
                Save Transaction
            </button>

        </form>

        <a href="{{ url_for('index') }}">
            ← Back
        </a>

    </div>

</body>
</html>
